<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 1260 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdd-flow-title sdd-flow-desc">
      <title id="sdd-flow-title">The SDD flow of sdd-factory</title>
      <desc id="sdd-flow-desc">Swimlane diagram: /sdd launches one subagent per phase, triage, spec, design, task, implement and review, in order; a human approves at gates 0 to 3 between the steps and at gate 4 after review; bug, task and constitution issues skip from gate 0 to task; a failed review or a human rework comment loops back to implement; each step leaves an artifact and a state label on the GitHub issue or pull request.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#737373"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1447e6"/></marker>
      </defs>

      <rect x="0" y="64" width="1260" height="476" fill="#fafafa"/>

      <!-- Lanes -->
      <line x1="40" y1="96" x2="1220" y2="96" stroke="rgba(10,10,10,0.22)" stroke-width="1"/>
      <line x1="40" y1="216" x2="1220" y2="216" stroke="rgba(10,10,10,0.12)" stroke-width="1"/>
      <line x1="40" y1="356" x2="1220" y2="356" stroke="rgba(10,10,10,0.12)" stroke-width="1"/>
      <line x1="40" y1="456" x2="1220" y2="456" stroke="rgba(10,10,10,0.22)" stroke-width="1"/>
      <line x1="160" y1="96" x2="160" y2="456" stroke="rgba(10,10,10,0.22)" stroke-width="1"/>
      <text x="56" y="160" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">HUMAN</text>
      <text x="56" y="280" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">AGENT</text>
      <text x="56" y="400" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">GITHUB</text>
      <text x="56" y="416" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">artifact · state</text>

      <!-- Arrows (drawn first) -->
      <!-- step → gate (up) -->
      <path d="M328 260 H344 Q352 260 352 252 V178" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M504 260 H520 Q528 260 528 252 V178" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M680 260 H696 Q704 260 704 252 V178" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M856 260 H872 Q880 260 880 252 V178" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- gate → next step (down) -->
      <path d="M372 156 H432 Q440 156 440 164 V232" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M548 156 H608 Q616 156 616 164 V232" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M724 156 H764 Q772 156 772 164 V232" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M900 156 H940 Q948 156 948 164 V232" fill="none" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- implement → review -->
      <line x1="1032" y1="276" x2="1072" y2="276" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- review → gate 4 (focal) -->
      <line x1="1144" y1="240" x2="1144" y2="178" stroke="#1447e6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- shortcut: gate 0 → task for Bug / Task / Constitution -->
      <path d="M352 136 V128 Q352 120 360 120 H804 Q812 120 812 128 V232" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- gate 4 /rework → implement -->
      <path d="M1124 156 H996 Q988 156 988 164 V232" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- review FAIL → implement -->
      <path d="M1144 312 V328 Q1144 336 1136 336 H976 Q968 336 968 328 V320" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 6–10px off the line) -->
      <rect x="500" y="102" width="164" height="12" rx="2" fill="#fafafa"/>
      <text x="582" y="111" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">BUG · TASK · CONSTITUTION</text>
      <rect x="1028" y="138" width="64" height="12" rx="2" fill="#fafafa"/>
      <text x="1060" y="147" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">/REWORK</text>
      <rect x="1012" y="316" width="88" height="12" rx="2" fill="#fafafa"/>
      <text x="1056" y="325" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">FAIL · REWORK</text>

      <!-- Human gates (diamonds) -->
      <g font-family="'Geist', system-ui, sans-serif" font-size="8" font-weight="600" fill="#0a0a0a" text-anchor="middle">
        <polygon points="352,136 372,156 352,176 332,156" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/><text x="352" y="159">G0</text>
        <polygon points="528,136 548,156 528,176 508,156" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/><text x="528" y="159">G1</text>
        <polygon points="704,136 724,156 704,176 684,156" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/><text x="704" y="159">G2</text>
        <polygon points="880,136 900,156 880,176 860,156" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/><text x="880" y="159">G3</text>
        <polygon points="1144,136 1164,156 1144,176 1124,156" fill="rgba(20,71,230,0.08)" stroke="#1447e6" stroke-width="1"/><text x="1144" y="159">G4</text>
      </g>
      <!-- gate labels: what the human sets -->
      <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#737373" text-anchor="end">
        <text x="346" y="194">sdd:ready</text>
        <text x="522" y="186">spec</text><text x="522" y="196">approved</text>
        <text x="698" y="186">design</text><text x="698" y="196">approved</text>
        <text x="874" y="186">task</text><text x="874" y="196">approved</text>
        <text x="1120" y="186">merge or</text><text x="1120" y="196">/rework</text>
      </g>

      <!-- Agent steps -->
      <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
        <rect x="200" y="240" width="128" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="264" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Triage</text>
        <text x="264" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">triage</text>

        <rect x="376" y="240" width="128" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="440" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Spec</text>
        <text x="440" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">spec</text>

        <rect x="552" y="240" width="128" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="616" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Design</text>
        <text x="616" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">design</text>

        <rect x="728" y="240" width="128" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="792" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Task</text>
        <text x="792" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">task</text>

        <rect x="904" y="240" width="128" height="72" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="968" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Implement</text>
        <text x="968" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">implement</text>

        <rect x="1080" y="240" width="128" height="72" rx="6" fill="rgba(20,71,230,0.08)" stroke="#1447e6" stroke-width="1"/>
        <text x="1144" y="272" fill="#0a0a0a" font-size="12" font-weight="600">Review · 6 gates</text>
        <text x="1144" y="290" fill="#737373" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">review</text>
      </g>

      <!-- GitHub artifacts and states -->
      <g font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="500" fill="#0a0a0a" text-anchor="middle">
        <text x="264" y="396">Issue comment</text>
        <text x="440" y="396">Draft PR · spec.md</text>
        <text x="616" y="396">design.md · ADRs</text>
        <text x="792" y="396">Issue comment</text>
        <text x="968" y="396">Code · tests · sdd ci</text>
        <text x="1144" y="396">Gate results on PR</text>
      </g>
      <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#737373" text-anchor="middle">
        <text x="264" y="416">sdd:triage</text>
        <text x="440" y="416">sdd:spec</text>
        <text x="616" y="416">sdd:design</text>
        <text x="792" y="416">sdd:task</text>
        <text x="968" y="416">sdd:implementing</text>
        <text x="1144" y="416">sdd:final-review</text>
      </g>

      <!-- Legend -->
      <line x1="40" y1="476" x2="1220" y2="476" stroke="rgba(10,10,10,0.12)" stroke-width="0.8"/>
      <text x="40" y="492" fill="#737373" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <g font-family="'Geist', system-ui, sans-serif" font-size="8" fill="#737373">
        <rect x="40" y="508" width="16" height="12" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="64" y="517">Phase (subagent)</text>
        <polygon points="168,506 176,514 168,522 160,514" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="184" y="517">Human approval gate</text>
        <rect x="320" y="508" width="16" height="12" rx="2" fill="rgba(20,71,230,0.08)" stroke="#1447e6" stroke-width="1"/>
        <text x="344" y="517">Where the code is judged</text>
        <line x1="480" y1="514" x2="508" y2="514" stroke="#737373" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="516" y="517">Flow (Feature, Change)</text>
        <line x1="656" y1="514" x2="684" y2="514" stroke="#737373" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="692" y="517">Shortcut or rework loop</text>
      </g>
    </svg>
