# Review Gate result — attached to the pull request, never stored in docs/
#
# status:   PASS | FAIL | NEEDS_HUMAN | BLOCKED
#   PASS         no BLOCKER findings
#   FAIL         at least one BLOCKER → triggers rework
#   NEEDS_HUMAN  gate cannot decide autonomously, or the rework budget is exhausted
#   BLOCKED      gate could not run (red build, missing artifact)
#
# severity: BLOCKER | WARNING | NIT
#   BLOCKER      fails the gate
#   WARNING      reported; must be acknowledged at Approval Gate 2
#   NIT          informational

gate: completeness | mechanical | behaviour | structure | risk
issue: 123
pr: 45
commit: <sha>
status: PASS
rework_cycle: 0                    # 0, 1, 2… for the code review; plan for the completeness gate
reviewed_since: <sha>              # cycle ≥ 1 only: the head commit the previous cycle reviewed (the delta starts there)

# Required for completeness and behaviour; optional elsewhere.
requirements:
  OT-001: PASS
  OT-002: PASS
  OT-003: FAIL

findings:
  - severity: BLOCKER
    requirement: OT-003            # omit if not requirement-bound
    location: contexts/payroll/src/use-cases/calculate-overtime/calculate-overtime.test.ts
    description: >
      No test covers rejection when the overtime policy
      does not define a percentage.
    required_action: Add a test asserting the exact domain error for OT-003.
    # cycle ≥ 1 only:
    # carried: fixed | not-fixed | new      fixed = a BLOCKER of the previous cycle now resolved (report it as NIT)
    # disputed: upheld | withdrawn          only for a finding implement disputed; upheld → NEEDS_HUMAN, never rework

  - severity: WARNING
    location: contexts/payroll/src/infrastructure/persistence/d1-overtime-repository.ts:42
    description: >
