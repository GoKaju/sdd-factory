# .sdd/config.yml — how the sdd-factory plugin operates in this repository.
# Created by /sdd-init, edited with /sdd-config (or by hand). Versioned: every collaborator runs the same factory.
# Rules of the project live in docs/constitution.md; nothing here is a rule.

# Prose of tracker comments, issue forms and PR bodies: en | es
language: en

# Model of the subagent that runs each phase: haiku | sonnet | opus | inherit (the session's model).
models:
  triage: sonnet
  spec: opus
  design: opus
  task: sonnet
  implement: opus
  reviewer: opus
  learning: sonnet

gates:
  # Human approval gates /sdd may grant on its own once the artifact is verifiably clean.
  # Any of: Intake, Spec, Design, Task, Final. Add "(judged)" to require the reviewer's PASS first.
  # A Constitution issue is never merged by a machine. Empty list = every gate waits for a person.
  delegated: []
  # What a delegated Final does when every gate is PASS but WARNINGs remain:
  #   human  → hold the PR for a person (default)
  #   merge  → merge and list the WARNINGs on the PR
  #   rework → file a /rework with the code WARNINGs (bounded by rework_budget; docs WARNINGs are listed for a Change)
  warnings_at_final: human
  # Review cycles before the issue stops as NEEDS_HUMAN
  rework_budget: 3

await:
  # sdd await polls GitHub every interval_seconds, in bash, without an agent turn
  interval_seconds: 30
  # /sdd keeps waiting for a human up to max_minutes in total, then ends the turn (re-run /sdd N to resume)
  max_minutes: 120

# Optional: USD per million tokens per model family, so `sdd log summary` and the learning document estimate the cost of
# every subagent run (tokens come from the host's SubagentStop hook). Without this block the plugin uses the list prices
# of https://platform.claude.com/docs/en/about-claude/pricing as of 2026-09-11 (base input · output · 5-minute cache
# write · cache read): fable 10/50/12.50/0.25 · opus 5/25/6.25/0.50 · sonnet 2/10/2.50/0.20 · haiku 1/5/1.25/0.10.
# Uncomment a family to override it with your plan's prices (e.g. 1-hour cache writes are 2x base input, not 1.25x).
# pricing:
#   fable:
#     input: 10
#     output: 50
#     cache_write: 12.50
#     cache_read: 0.25
#   opus:
#     input: 5
#     output: 25
#     cache_write: 6.25
#     cache_read: 0.50
#   sonnet:
#     input: 2
#     output: 10
#     cache_write: 2.50
#     cache_read: 0.20
#   haiku:
#     input: 1
#     output: 5
#     cache_write: 1.25
#     cache_read: 0.10

# Deterministic checks, in CI order. `sdd ci` runs exactly this list, fail-fast; Review Gates never run on a red build.
commands:
  - "<install with a frozen lockfile>"
  - "<lint>"
  - "<typecheck>"
  - "<build>"
  - "<tests with coverage>"
